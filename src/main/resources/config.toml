# Logify: вход на сервер с подтверждением через Discord.
# Файл создаётся автоматически при первом запуске. Изменения применяются после перезапуска прокси.

[database]
# Подключение к MariaDB. В docker-compose хост совпадает с именем сервиса базы.
host = "mariadb"
port = 3306
name = "logify"
username = "logify"
# Пароль можно не хранить в файле: переменная окружения LOGIFY_DATABASE_PASSWORD важнее этого значения.
password = ""
# Префикс таблиц плагина. Только латинские буквы, цифры и "_".
table-prefix = "logify_"
# Максимум одновременных соединений с базой.
pool-size = 4

[discord]
# Токен бота: Discord Developer Portal -> приложение -> Bot -> Reset Token.
# Там же включите "Message Content Intent", иначе бот не увидит текст команды.
# Переменная окружения LOGIFY_DISCORD_TOKEN важнее этого значения.
token = ""
# ID канала для регистрации (ПКМ по каналу -> "Копировать ID канала", нужен режим разработчика).
# Боту в канале нужны права: просмотр канала, отправка сообщений, управление сообщениями.
registration-channel-id = ""
# Команда регистрации. Игрок отправляет в канал "<команда> <код>", например "/r AZA-AXF".
command = "/r"
# Статус бота "Играет в ...". Пустая строка - без статуса.
activity = ""

[auth]
# Сколько секунд даётся на регистрацию, прежде чем игрока отключит с сервера.
registration-timeout = 300
# Сколько секунд ждать подтверждения входа в Discord.
login-timeout = 120
# Сколько минут повторный вход с того же IP не требует подтверждения. 0 - подтверждать каждый вход.
session-duration = 720
# Сколько Minecraft-аккаунтов можно привязать к одному Discord-аккаунту.
max-accounts-per-discord = 1
# Как часто (в секундах) повторять подсказку в чате игры. 0 - показать один раз.
reminder-interval = 30
# Допустимые ники (регулярное выражение). Игроков с другими никами не пустит на сервер.
nickname-pattern = "^[A-Za-z0-9_]{3,16}$"
# Сколько команд регистрации один пользователь Discord может отправить за минуту (защита от перебора кодов).
attempts-per-minute = 5

[premium]
# Пускать без подтверждения игроков, которых прокси проверил через Mojang (лицензионный аккаунт).
skip-online-mode = true
# Включать проверку Mojang для свободных ников, которые принадлежат лицензионным аккаунтам.
# Такой ник сможет занять только владелец лицензии, а игрок получит лицензионный UUID.
# Ники, уже зарегистрированные через Discord, это не затрагивает.
auto-detect = false

[limbo]
# Мир ожидания, в котором игрок проходит авторизацию.
# Измерение: OVERWORLD, NETHER или THE_END.
dimension = "THE_END"
# Режим игры: SURVIVAL, CREATIVE, ADVENTURE или SPECTATOR.
game-mode = "ADVENTURE"

# Сообщения в игре в формате MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Пустая строка отключает сообщение (кроме причин отключения с сервера).
# Плейсхолдеры: <player> - ник, <command> - команда регистрации (по клику копируется),
# <channel> - канал регистрации, <timeout> - время на действие в секундах,
# <registered> - ник в том виде, в котором он зарегистрирован.
[messages]
registration = "<gray>Аккаунт <white><player></white> не зарегистрирован.<newline><gray>Отправьте команду <gold><bold><command></bold></gold> в канал <aqua><channel></aqua> нашего Discord-сервера.<newline><dark_gray>Нажмите на команду, чтобы скопировать её. Код действует <timeout> сек."
command-hover = "<gray>Нажмите, чтобы скопировать"
registration-title = "<gold>Регистрация"
registration-subtitle = "<gray>Отправьте команду из чата в Discord"
registered = "<green>Аккаунт привязан к Discord. Приятной игры!"
login = "<gray>Подтвердите вход в личных сообщениях от бота в Discord.<newline><dark_gray>Запрос действует <timeout> сек."
login-title = "<gold>Подтвердите вход"
login-subtitle = "<gray>Запрос отправлен вам в Discord"
login-approved = "<green>Вход подтверждён. Приятной игры!"
kick-login-denied = "<red>Вход отклонён владельцем аккаунта."
kick-registration-timeout = "<red>Время на регистрацию истекло.<newline><gray>Зайдите снова, чтобы получить новый код."
kick-login-timeout = "<red>Вход не подтверждён вовремя.<newline><gray>Зайдите снова, чтобы получить новый запрос."
kick-direct-messages-closed = "<red>Не удалось отправить запрос в Discord.<newline><gray>Разрешите личные сообщения от участников сервера и зайдите снова."
kick-unavailable = "<red>Авторизация временно недоступна.<newline><gray>Попробуйте зайти позже."
kick-invalid-nickname = "<red>Недопустимый ник.<newline><gray>Используйте от 3 до 16 латинских букв, цифр и \"_\"."
kick-wrong-case = "<red>Этот ник зарегистрирован как <white><registered></white>.<newline><gray>Зайдите с ником в точности как при регистрации."
kick-already-authenticating = "<red>Под этим ником уже кто-то проходит авторизацию."
kick-name-taken = "<red>Этот ник только что зарегистрировали.<newline><gray>Зайдите снова."

# Сообщения бота в Discord (поддерживается Markdown Discord).
# Плейсхолдеры: {player} - ник, {code} - код, {command} - команда регистрации,
# {limit} - лимит аккаунтов, {ip} - IP игрока, {time} - время запроса, {mention} - упоминание пользователя.
[discord-messages]
registration-success = "✅ Аккаунт **{player}** привязан к вашему Discord. Можете заходить на сервер!"
registration-invalid-code = "❌ Код **{code}** не найден или устарел. Зайдите на сервер, чтобы получить новый."
registration-usage = "❌ Отправьте команду из игрового чата, например: `{command} ABC-DEF`."
registration-limit = "❌ К вашему Discord уже привязано максимальное число аккаунтов: {limit}."
registration-already-registered = "❌ Ник **{player}** уже зарегистрирован."
registration-rate-limited = "⏳ Слишком много попыток. Подождите минуту и попробуйте снова."
registration-error = "⚠️ Не удалось завершить регистрацию. Попробуйте ещё раз позже."
direct-messages-closed = "{mention}, не удалось отправить вам личное сообщение. Разрешите личные сообщения от участников сервера и повторите команду."
login-request-title = "Попытка входа на сервер"
login-request = "Кто-то входит на сервер под ником **{player}**.\nIP: `{ip}`\nВремя: {time}\n\nЕсли это вы, нажмите «Подтвердить». Если нет, нажмите «Отклонить»."
login-approve-button = "Подтвердить"
login-deny-button = "Отклонить"
login-approved = "✅ Вход под ником **{player}** подтверждён."
login-denied = "⛔ Вход под ником **{player}** отклонён."
login-expired = "⌛ Запрос на вход под ником **{player}** больше не действует."
