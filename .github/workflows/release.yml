name: Release

# Публикует релиз при пуше тега вида v1.2.3: собирает плагин с версией из тега
# и прикладывает <name>-1.2.3-all.jar к релизу на GitHub.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Версия должна совпадать с toolchain в build.gradle.kts.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # -Pversion переопределяет version из gradle.properties, тег v1.2.3 даёт версию 1.2.3.
      - name: Build and test
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*-all.jar --title "$GITHUB_REF_NAME" --generate-notes
