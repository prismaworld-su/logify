name: Build

on:
  push:
    branches: [ stable ]
  pull_request:
    branches: [ stable ]
  workflow_dispatch:

# Новый запуск для той же ветки или PR отменяет ещё не завершившийся предыдущий.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Версия должна совпадать с toolchain в build.gradle.kts.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Кэширует зависимости Gradle и проверяет gradle-wrapper.jar по официальным контрольным суммам.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build собирает shadowJar и запускает тесты.
      - name: Build and test
        run: ./gradlew build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: logify
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14
